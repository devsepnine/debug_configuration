[package]
name = "run_config_manager"
version = "0.6.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
iced = { version = "0.14", features = ["tokio", "canvas", "svg", "advanced"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.22", features = ["v4", "serde"] }
dirs = "6.0"
tokio = { version = "1.50", features = ["full"] }
ttf-parser = "0.25.1"
unicode-width = "0.2.2"
regex = "1.12"
open = "5.3"
ctrlc = { version = "3.5", features = ["termination"] }
rfd = "0.17"
notify-rust = "4.18.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# 인앱 자기 업데이트: 다운로드 무결성(sha2) + 서명 검증(minisign-verify) + 자산 추출(flate2/tar).
# 전부 순수 Rust — 시스템 의존성/크로스컴파일 부담 없음 (rustls 정책과 일관).
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
minisign-verify = "0.2"
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# 가상 시간 테스트(start_paused) — windows ConPTY 종료 상태기계의 장시간
# 드레인 시나리오를 ms 단위로 검증한다. 테스트 빌드에만 피처 적용.
tokio = { version = "1.50", features = ["test-util"] }
