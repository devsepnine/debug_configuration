name: Checksum

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to refresh checksums for, for example v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  checksum:
    name: Generate checksums
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$TAG_NAME" --dir dist --pattern "run_config_manager-*"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum run_config_manager-* > checksums.txt

      - name: Upload checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag }}
        run: |
          gh release upload "$TAG_NAME" dist/checksums.txt --clobber
