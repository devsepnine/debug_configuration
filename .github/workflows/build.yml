name: Build

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: run_config_manager

jobs:
  quality:
    name: Check, Clippy, Test, and Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Check
        run: cargo check --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Windows 경로(ConPTY 전송·stdin·폴백 pipe 등 cfg(windows) 분기)가 릴리스 빌드 전에
  # 검증되도록 한다 — ubuntu 잡만으로는 cfg(windows) 코드가 전혀 열리지 않는다.
  # windows-latest(Server 2022)는 ConPTY를 지원하므로 conpty_integration이 실제로 돈다.
  # 테스트는 PTY/조립기 관련 모듈로 스코프한다(전 스위트는 windows에서 실행 이력이
  # 없어 미지수 — fix-as-found로 후속 확대).
  windows-check:
    name: Check and Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Check
        run: cargo check --locked --all-targets

      - name: Test (pty/assembler scope)
        run: cargo test --locked -- pty_loop conpty_integration assembler ansi
