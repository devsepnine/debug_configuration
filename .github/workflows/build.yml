name: Build

on:
  pull_request:
  push:
    branches:
      - develop
      - 'release/**'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: run_config_manager

jobs:
  quality:
    name: Check, Clippy, Test, and Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libgtk-3-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Check
        run: cargo check --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

  build:
    name: Build ${{ matrix.name }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            artifact_name: run_config_manager-windows-x64.msi
          - name: linux-x64
            os: ubuntu-latest
            artifact_name: run_config_manager-linux-x64.tar.gz
          - name: macos-x64
            os: macos-15-intel
            artifact_name: run_config_manager-macos-x64.dmg
          - name: macos-arm64
            os: macos-latest
            artifact_name: run_config_manager-macos-arm64.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libgtk-3-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Build release
        run: cargo build --release --locked

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-windows-installer.ps1
          Copy-Item "target/packaging/run_config_manager-installer.msi" "${{ matrix.artifact_name }}"

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/package-linux.sh scripts/install-linux.sh
          ./scripts/package-linux.sh "${{ matrix.artifact_name }}"

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: |
          chmod +x build_macos_app.sh scripts/package-macos.sh
          ./build_macos_app.sh
          ./scripts/package-macos.sh "${{ matrix.artifact_name }}"
          cp "target/packaging/macos/${{ matrix.artifact_name }}" "${{ matrix.artifact_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error
