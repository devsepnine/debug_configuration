name: Release

run-name: Release ${{ github.event.inputs.tag || github.ref_name }}

on:
  push:
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0 (manual fallback only)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: run_config_manager

jobs:
  validate:
    name: Validate release input
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag name
        id: resolve
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${REF_NAME#release/}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+].+)?$ ]]; then
            echo "::error::Resolved tag '$TAG' is not in the form vX.Y.Z (got from ref '$REF_NAME' / input '$INPUT_TAG')."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate release state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.resolve.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! git ls-remote --exit-code --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$TAG_NAME" >/dev/null; then
              echo "::error::Tag '$TAG_NAME' does not exist. Push the tag before running this workflow."
              exit 1
            fi
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Release '$TAG_NAME' already exists. Delete it first or use the Checksum workflow to refresh checksums."
            exit 1
          fi

  quality:
    name: Check, Clippy, Test, and Format
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            desktop-file-utils \
            pkg-config

      - name: Check
        run: cargo check --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Windows 품질 게이트: ConPTY 전송(cfg(windows) 경로)을 실 러너에서 테스트한다.
  # 빌드 매트릭스와 병렬로 돌고 publish만 막는다 — 릴리스는 windows 테스트 그린
  # 없이 발행될 수 없다.
  quality-windows:
    name: Check and Test (Windows)
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Check
        run: cargo check --locked --all-targets

      - name: Test (pty/assembler scope)
        run: cargo test --locked -- pty_loop conpty_integration assembler ansi

  build:
    name: Build ${{ matrix.name }}
    needs: [validate, quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            artifact_name: run_config_manager-windows-x64.msi
          - name: linux-x64
            os: ubuntu-latest
            artifact_name: run_config_manager-linux-x64.tar.gz
          - name: macos-x64
            os: macos-15-intel
            artifact_name: run_config_manager-macos-x64.dmg
            update_archive_name: run_config_manager-macos-x64-app.tar.gz
          - name: macos-arm64
            os: macos-latest
            artifact_name: run_config_manager-macos-arm64.dmg
            update_archive_name: run_config_manager-macos-arm64-app.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            desktop-file-utils \
            pkg-config

      # fmt는 OS 무관이라 quality job(ubuntu)에서 이미 게이트했다. 여기선 OS별 컴파일을
      # 빠르게 검증하는 check만 남긴다(바로 뒤 release 빌드보다 일찍 실패).
      - name: Check
        run: cargo check --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-windows-installer.ps1
          Copy-Item "target/packaging/run_config_manager-installer.msi" "${{ matrix.artifact_name }}"

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/package-linux.sh scripts/install-linux.sh
          ./scripts/package-linux.sh "${{ matrix.artifact_name }}"

      - name: Validate Linux artifact
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate packaging/linux/dev.runconfigmanager.app.desktop
          tar -tzf "${{ matrix.artifact_name }}" | grep -Fx "run_config_manager-linux-x64/share/applications/dev.runconfigmanager.app.desktop"
          tar -tzf "${{ matrix.artifact_name }}" | grep -Fx "run_config_manager-linux-x64/share/icons/hicolor/scalable/apps/dev.runconfigmanager.app.svg"
          tar -tzf "${{ matrix.artifact_name }}" | grep -Fx "run_config_manager-linux-x64/install-linux.sh"

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: |
          chmod +x build_macos_app.sh scripts/package-macos.sh
          ./build_macos_app.sh
          ./scripts/package-macos.sh "${{ matrix.artifact_name }}"
          cp "target/packaging/macos/${{ matrix.artifact_name }}" "${{ matrix.artifact_name }}"

      # 인앱 자기 업데이트용 .app 아카이브. 반드시 build_macos_app.sh(서명 포함) 이후에
      # 생성해야 Info.plist 버전·ad-hoc 서명이 일치한다. 자산 이름은
      # src/services/update_check.rs의 platform_asset_name()과 일치해야 한다.
      # COPYFILE_DISABLE: bsdtar가 파일마다 ._* AppleDouble 사이드카를 넣는 것을 막는다
      # — 섞이면 설치된 번들의 코드서명 리소스 실이 깨진다 (앱 추출기도 방어하지만 원천 차단).
      - name: Package macOS update archive
        if: runner.os == 'macOS'
        env:
          COPYFILE_DISABLE: "1"
        run: |
          tar -czf "${{ matrix.update_archive_name }}" -C target/release RunConfigManager.app

      # 방금 만든 실제 아카이브가 앱의 추출→검사→스왑 코드로 정상 적용되는지 검증한다.
      # (레시피 회귀 — pax/AppleDouble 등 — 를 릴리스 전에 잡는 게이트)
      - name: Verify update archive applies cleanly
        if: runner.os == 'macOS'
        env:
          RCM_E2E_ARCHIVE: ${{ github.workspace }}/${{ matrix.update_archive_name }}
        run: |
          cargo test --locked services::self_update::tests::real_archive_applies_to_fake_bundle -- --ignored --exact

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

      - name: Upload update archive
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}-update
          path: ${{ matrix.update_archive_name }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build, quality-windows]
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      # 인앱 업데이트 무결성: checksums.txt를 minisign 개인키로 서명한다.
      # 앱은 내장 공개키(src/services/self_update.rs)로 이 서명을 검증한 뒤에만
      # 체크섬을 신뢰하므로, Secret이 없으면 서명 없는 릴리스가 나가지 않도록 실패시킨다.
      - name: Sign checksums (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::MINISIGN_SECRET_KEY secret is not set — in-app updates require signed checksums."
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y minisign
          # 서명 실패로 스텝이 중단돼도 개인키 파일이 남지 않도록 항상 정리한다.
          trap 'rm -f minisign.key' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key
          minisign -S -s minisign.key -m dist/checksums.txt
          test -f dist/checksums.txt.minisig

      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.validate.outputs.tag_name }}
          TARGET_REF: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" dist/* \
            --title "$TAG_NAME" \
            --generate-notes \
            --draft \
            --target "$TARGET_REF"
