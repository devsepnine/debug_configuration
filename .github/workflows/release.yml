name: Release

run-name: Release ${{ github.event.inputs.tag || github.ref_name }}

on:
  push:
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0 (manual fallback only)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: run_config_manager

jobs:
  validate:
    name: Validate release input
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag name
        id: resolve
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${REF_NAME#release/}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+].+)?$ ]]; then
            echo "::error::Resolved tag '$TAG' is not in the form vX.Y.Z (got from ref '$REF_NAME' / input '$INPUT_TAG')."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate release state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.resolve.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! git ls-remote --exit-code --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$TAG_NAME" >/dev/null; then
              echo "::error::Tag '$TAG_NAME' does not exist. Push the tag before running this workflow."
              exit 1
            fi
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Release '$TAG_NAME' already exists. Delete it first or use the Checksum workflow to refresh checksums."
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            artifact_name: run_config_manager-windows-x64.msi
          - name: linux-x64
            os: ubuntu-latest
            artifact_name: run_config_manager-linux-x64.tar.gz
          - name: macos-x64
            os: macos-15-intel
            artifact_name: run_config_manager-macos-x64.dmg
          - name: macos-arm64
            os: macos-latest
            artifact_name: run_config_manager-macos-arm64.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libgtk-3-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-windows-installer.ps1
          Copy-Item "target/packaging/run_config_manager-installer.msi" "${{ matrix.artifact_name }}"

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/package-linux.sh scripts/install-linux.sh
          ./scripts/package-linux.sh "${{ matrix.artifact_name }}"

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: |
          chmod +x build_macos_app.sh scripts/package-macos.sh
          ./build_macos_app.sh
          ./scripts/package-macos.sh "${{ matrix.artifact_name }}"
          cp "target/packaging/macos/${{ matrix.artifact_name }}" "${{ matrix.artifact_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build]
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.validate.outputs.tag_name }}
          TARGET_REF: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" dist/* \
            --title "$TAG_NAME" \
            --generate-notes \
            --draft \
            --target "$TARGET_REF"
